name: validate-credentials

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: validate-credentials
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate credentials
        env:
          BOXYING_ACCESS_TOKEN: ${{ secrets.BOXYING_ACCESS_TOKEN }}
          BOXYING_SESSION: ${{ secrets.BOXYING_SESSION }}
          BOXYING_API_USER: ${{ secrets.BOXYING_API_USER }}
          ELYSIVER_ACCESS_TOKEN: ${{ secrets.ELYSIVER_ACCESS_TOKEN }}
          ELYSIVER_API_USER: ${{ secrets.ELYSIVER_API_USER }}
          N1NEMAN_ACCESS_TOKEN: ${{ secrets.N1NEMAN_ACCESS_TOKEN }}
          N1NEMAN_API_USER: ${{ secrets.N1NEMAN_API_USER }}
          JIUUIJ_ACCESS_TOKEN: ${{ secrets.JIUUIJ_ACCESS_TOKEN }}
          JIUUIJ_API_USER: ${{ secrets.JIUUIJ_API_USER }}
          R91_ACCESS_TOKEN: ${{ secrets.R91_ACCESS_TOKEN }}
          R91_API_USER: ${{ secrets.R91_API_USER }}
          CHY_ACCESS_TOKEN: ${{ secrets.CHY_ACCESS_TOKEN }}
          CHY_API_USER: ${{ secrets.CHY_API_USER }}
          CHYSUB_COOKIE: ${{ secrets.CHYSUB_COOKIE }}
          CHYSUB_SESSION: ${{ secrets.CHYSUB_SESSION }}
          CHYSUB_CF_CLEARANCE: ${{ secrets.CHYSUB_CF_CLEARANCE }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python validate_credentials.py
