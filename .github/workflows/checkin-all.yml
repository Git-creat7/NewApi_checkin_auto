name: checkin-all

on:
  workflow_dispatch:
  schedule:
    # UTC 3:00 = 北京时间 11:00
    # 随机延迟 10-110 分钟，覆盖 11:10-12:50
    - cron: '0 3 * * *'

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    concurrency:
      group: checkin-all
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Random delay (10-110 min)
        if: github.event_name == 'schedule'
        run: |
          DELAY=$(python3 -c "import random; print(random.randint(10, 110))")
          echo "随机延迟 $DELAY 分钟"
          sleep $((DELAY * 60))

      - name: Run all checkins
        env:
          BOXYING_ACCESS_TOKEN: ${{ secrets.BOXYING_ACCESS_TOKEN }}
          BOXYING_SESSION: ${{ secrets.BOXYING_SESSION }}
          BOXYING_API_USER: ${{ secrets.BOXYING_API_USER }}
          ELYSIVER_ACCESS_TOKEN: ${{ secrets.ELYSIVER_ACCESS_TOKEN }}
          ELYSIVER_API_USER: ${{ secrets.ELYSIVER_API_USER }}
          N1NEMAN_ACCESS_TOKEN: ${{ secrets.N1NEMAN_ACCESS_TOKEN }}
          N1NEMAN_API_USER: ${{ secrets.N1NEMAN_API_USER }}
          JIUUIJ_ACCESS_TOKEN: ${{ secrets.JIUUIJ_ACCESS_TOKEN }}
          JIUUIJ_API_USER: ${{ secrets.JIUUIJ_API_USER }}
          MUYUAN_ACCESS_TOKEN: ${{ secrets.MUYUAN_ACCESS_TOKEN }}
          MUYUAN_API_USER: ${{ secrets.MUYUAN_API_USER }}
          R91_ACCESS_TOKEN: ${{ secrets.R91_ACCESS_TOKEN }}
          R91_API_USER: ${{ secrets.R91_API_USER }}
          MAOYULIN_ACCESS_TOKEN: ${{ secrets.MAOYULIN_ACCESS_TOKEN }}
          MAOYULIN_API_USER: ${{ secrets.MAOYULIN_API_USER }}
          CHY_ACCESS_TOKEN: ${{ secrets.CHY_ACCESS_TOKEN }}
          CHY_API_USER: ${{ secrets.CHY_API_USER }}
          MOFAS_ACCESS_TOKEN: ${{ secrets.MOFAS_ACCESS_TOKEN }}
          MOFAS_API_USER: ${{ secrets.MOFAS_API_USER }}
          VENLACY_ACCESS_TOKEN: ${{ secrets.VENLACY_ACCESS_TOKEN }}
          VENLACY_API_USER: ${{ secrets.VENLACY_API_USER }}
          CUN_ACCESS_TOKEN: ${{ secrets.CUN_ACCESS_TOKEN }}
          CUN_API_USER: ${{ secrets.CUN_API_USER }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python checkin_all.py
